version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: medpro-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/outputs:/app/outputs   # persist processed files
      - ./backend/temp:/app/temp
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    container_name: medpro-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
